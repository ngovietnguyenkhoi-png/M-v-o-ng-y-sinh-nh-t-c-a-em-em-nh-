<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Chúc Mừng Sinh Nhật Em</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
body{
    min-height:100vh;
    background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.3) 1px, transparent 1px),
    radial-gradient(circle at 70% 60%, rgba(255,255,255,.2) 1px, transparent 1px),
    radial-gradient(circle at 40% 80%, rgba(255,255,255,.25) 1px, transparent 1px),
    linear-gradient(180deg,#0f172a,#1e293b,#334155);
    background-size:200px 200px,250px 250px,300px 300px,100% 100%;
    font-family:"Times New Roman",serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}
.card{
    width:100%;
    max-width:900px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:30px;
    box-shadow:0 0 30px rgba(255,255,255,.15);
}
h1{
    text-align:center;
    margin-bottom:25px;
    font-size:42px;
}
p{
    font-size:25px;
    line-height:1.9;
    margin-bottom:18px;
}
.center{
    text-align:center;
}
@media (max-width:768px){
    .card{
        padding:24px;
    }
    h1{
        font-size:34px;
    }
    p{
        font-size:23px;
    }
}
</style>
</head>
<body>
<div id="content" class="card"></div>
<script>
const unlockDate = new Date("2026-06-12T00:00:00");
function updatePage(){
    const now = new Date();
    if(now < unlockDate){
        const diff = unlockDate - now;
        const days = Math.floor(diff/(1000*60*60*24));
        const hours = Math.floor((diff/(1000*60*60))%24);
        const mins = Math.floor((diff/(1000*60))%60);
        document.getElementById("content").innerHTML = `
            <h1>⏳ Chưa Đến Ngày Mở</h1>
            <p class="center">
            Hãy quay lại vào ngày <b>12/06/2026</b>
            </p>
            <p class="center">
            Còn lại:
            <br>
            <b>${days}</b> ngày
            <b>${hours}</b> giờ
            <b>${mins}</b> phút
            </p>
        `;
    }else{
        document.getElementById("content").innerHTML = `
        <h1>🎂 Chúc Mừng Sinh Nhật Em ❤️</h1>
        <p><strong>Em thương,</strong></p>
        <p>
        Đêm qua, khi anh đã ngủ, trái tim và lý trí lại ngồi đối diện nhau, nói chuyện về em.
        </p>
        <p>
        Lý trí lên tiếng trước. Nó trải những năm tháng đã qua lên mặt bàn, chỉ vào những khoảng cách, những ngã rẽ chưa thành hình, những đoạn đường mà ngày mai vẫn còn phủ đầy sương. Rồi nó hỏi:
        </p>
        <p><em>— Tại sao vẫn là em?</em></p>
        <p>
        Trái tim im lặng rất lâu. Nó không lục lọi câu trả lời trong ký ức, cũng không tìm trong những lời hứa của tương lai. Nó chỉ nhìn ra ngoài cửa sổ.
        </p>
        <p>
        Ngoài kia, mặt trăng vẫn lặng lẽ treo mình giữa khoảng không mà chưa từng hỏi liệu có ai ngước nhìn. Dòng sông vẫn miệt mài chảy về biển, chẳng cần biết hành trình ấy sẽ được nhớ đến hay lãng quên. Vì sao vẫn cháy giữa miền tối nhất của bầu trời, dù ánh sáng của chúng phải mất hàng nghìn năm mới chạm tới một ánh mắt.
        </p>
        <p>
        Đến lúc ấy, trái tim mới hiểu. Những điều đẹp đẽ không tồn tại để được lý giải. Chúng tồn tại để khiến con người ta thấy cuộc đời này đáng sống hơn. Bởi người ta đâu đứng dưới bầu trời đầy sao để tính xem có bao nhiêu ánh sáng. Đâu giữ một bản nhạc bên mình vì đã hiểu hết từng nốt ngân.
        </p>
        <p>
        Anh chưa từng yêu em vì em có thể xoa dịu được những băn khoăn của lý trí.
        </p>
        <p>
        Anh yêu em vì giữa ngổn ngang những điều cần cân nhắc, em là điều duy nhất anh không nỡ cân đo.
        </p>
        <p>
        Hôm nay là sinh nhật em.
        Anh không biết món quà nào có thể diễn tả hết những điều anh muốn nói,
        nên anh chỉ mong rằng tuổi mới sẽ mang đến cho em thật nhiều niềm vui,
        thật nhiều bình yên và thật nhiều điều tốt đẹp.
        </p>
        <p>
        Cảm ơn em vì đã xuất hiện trong cuộc đời anh.
        Chúc em một tuổi mới luôn hạnh phúc,
        luôn rạng rỡ như cách em đã làm trái tim anh trở nên đặc biệt hơn mỗi ngày.
        </p>
        <p class="center">
        ❤️ Chúc mừng sinh nhật em, cô gái anh yêu ❤️
        </p>
        <p>
        Yêu em rất nhiều.
        </p>
        <p>
        <strong>Anh.</strong>
        </p>
        `;
    }
}
updatePage();
setInterval(updatePage,60000);
</script>
</body>
</html>
