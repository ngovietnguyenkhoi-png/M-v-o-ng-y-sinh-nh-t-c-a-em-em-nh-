<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Một điều dành cho em</title>
</head>
<body>

<div id="content"></div>

<script>
const unlockDate = new Date("2026-06-12T00:00:00");

if (new Date() < unlockDate) {
    document.getElementById("content").innerHTML =
        "<h1>⏳ Chưa đến ngày mở</h1><p>Hãy quay lại vào 20/06/2026.</p>";
} else {
    document.getElementById("content").innerHTML =
        "<h1>💌 Gửi em</h1><p>Anh có một điều muốn nói...</p>";
}
</script>

</body>
</html>
